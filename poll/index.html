<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Poll</title>
</head>
<body>
<script>
    // 每 3 秒輪詢一次
    // 單次請求失敗可重試
    // 單次請求超時也算一次失敗，繼續重試
    // 從開始算起，整體超過 10 秒就直接失敗

    // interval = 3000;
    // onceTimeout = 1000;
    // maxTimeout = 10000;

    function poll(fn, option = {}) {
        const { interval = 3000, onceTimeout = 1000, maxTimeout = 10000 } = option;
        const start = performance.now();

        return new Promise((resolve, reject) => {
            function requestWithTimeout() {
                return Promise.race([
                    fn(),
                    new Promise((_, onceReject) => {
                        setTimeout(() => {
                            onceReject(new Error('onceTimeout'));
                        }, onceTimeout)
                    })
                ])
            }

            function run() {
                if(performance.now() - start >= maxTimeout) {
                    reject(new Error('maxTimeout'));
;                    return;
                }

                requestWithTimeout()
                    .then((value) => {
                        resolve(value);
                    })
                    .catch(() => {
                        setTimeout(() => {
                            run();
                        }, interval);
                    })
            }

            run();
        })

    }

    let count = 0;

    function mockApi() {
        return new Promise((resolve, reject) => {
            count++;
            console.log('第 ' + count + ' 次請求');

            setTimeout(() => {
                if (count < 3) {
                    reject(new Error('失敗'));
                } else {
                    resolve('成功');
                }
            }, 2000);
        });
    }

    poll(mockApi)
        .then((res) => {
            console.log('✅', res);
        })
        .catch((err) => {
            console.log('❌', err.message);
        });
</script>
</body>
</html>
